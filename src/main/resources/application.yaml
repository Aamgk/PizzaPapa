spring:
  #  config:
  #    import: optional:file:../../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/papas_pizza
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: db/main-changelog.xml
    enabled: true

application:
  security:
    jwt:
      secret-key=: ""
      expiration=: 86400000
      refresh-token.expiration=: 604800000